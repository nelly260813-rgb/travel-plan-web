<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ed">
<title>匈牙利 · 克罗地亚 · 奥地利｜旅行计划</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fffdf9; --ink:#252321; --muted:#817a72;
  --line:#e8e1d8; --accent:#b65d45; --accent2:#244f4a;
  --gold:#b58a4a; --shadow:0 12px 30px rgba(44,34,25,.08);
  --nav:72px; --radius:22px;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",Segoe UI,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px)}
button,input,select{font:inherit} button{cursor:pointer}
a{color:inherit}
.app{max-width:760px;margin:auto}
.page{display:none;min-height:100vh;padding:20px 16px 30px}
.page.active{display:block}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:28px 22px;color:#fff;background:
linear-gradient(135deg,rgba(35,68,65,.94),rgba(145,74,57,.82)),
radial-gradient(circle at 80% 10%,#e6b36c,transparent 34%);box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.2);border-radius:50%;right:-55px;top:-60px}
.kicker{font-size:12px;letter-spacing:.12em;opacity:.78;text-transform:uppercase}
h1{font-size:31px;line-height:1.18;margin:10px 0 10px;letter-spacing:-.03em}
.hero p{margin:0;color:rgba(255,255,255,.8);font-size:14px}
.hero-stats{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);padding:8px 11px;border-radius:999px;font-size:12px}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:25px 2px 12px}
.section-head h2{font-size:19px;margin:0;letter-spacing:-.02em}
.section-head span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.countdown{padding:16px;margin-bottom:12px;background:#fff8ed;border-color:#ead8b9}
.countdown strong{display:block;font-size:22px;margin-top:3px}
.countdown small{color:var(--muted)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.transit{min-width:88%;scroll-snap-align:start;padding:18px}
.transit-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.route{display:flex;align-items:center;gap:10px;margin:15px 0}
.code{font-size:28px;font-weight:750;letter-spacing:-.04em}
.city{font-size:12px;color:var(--muted);margin-top:2px}
.arrow{flex:1;text-align:center;color:var(--accent);font-size:18px}
.transit-time{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.meta{font-size:11px;color:var(--muted);margin-top:12px}
.dots{text-align:center;color:var(--muted);font-size:12px;padding:8px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{padding:17px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.quick b{display:block;margin-bottom:6px} .quick small{color:var(--muted)}
.notice{padding:14px 16px;margin-top:12px;border-radius:18px;background:#f0f5f2;border:1px solid #d6e5df;font-size:13px}
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.date-strip::-webkit-scrollbar{display:none}
.day-btn{min-width:78px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 8px;text-align:center}
.day-btn.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.day-btn b{display:block;font-size:14px} .day-btn small{font-size:11px;opacity:.75}
.route-line{height:3px;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;margin:0 12px 16px}
.sheet{position:fixed;inset:0;background:rgba(25,22,20,.38);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-panel{background:var(--bg);width:100%;max-height:90vh;border-radius:26px 26px 0 0;overflow:auto;padding:12px 16px 30px;animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;background:#d3cbc1;border-radius:99px;margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.close{border:0;background:#eae4dc;border-radius:50%;width:34px;height:34px}
.timeline{margin:20px 0 0 8px;border-left:2px solid #ddd4ca;padding-left:20px}
.event{position:relative;padding:0 0 20px}
.event:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);left:-26px;top:5px;border:3px solid var(--bg)}
.event-time{font-size:11px;color:var(--accent);font-weight:700}
.event h3{font-size:15px;margin:4px 0 5px}
.event p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#fff0e6;color:#a14f36;margin-top:6px}
.map{display:inline-block;font-size:11px;color:var(--accent2);margin-top:7px;text-decoration:none}
.hotel-mini{padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--card);font-size:12px}
.drive-card{padding:18px}
.drive-route{display:grid;grid-template-columns:12px 1fr;gap:12px}
.track{position:relative;margin-top:8px;border-left:2px dashed #c8beb3;height:72px}
.track:before,.track:after{content:"";position:absolute;left:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent2)}
.track:after{bottom:0;background:var(--accent)}
.check-group{padding:16px;margin-top:12px}
.check-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.check-row:last-child{border-bottom:0}
.check-row input:checked+span{text-decoration:line-through;color:#aaa}
.collapsible summary{cursor:pointer;padding:16px;font-weight:700}
.costs{padding:0 16px 16px;font-size:13px}
.cost-row{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted)}
.form{padding:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.primary{border:0;background:var(--accent2);color:white;border-radius:13px;padding:11px 14px;font-weight:700}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 12px}
.full{width:100%;margin-top:10px}
.list{margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.item .grow{flex:1}
.item.done .grow{text-decoration:line-through;color:#aaa}
.del{border:0;background:none;color:#b7afa6;font-size:18px}
.expense{padding:14px;margin-bottom:8px}
.exp-top{display:flex;justify-content:space-between;font-weight:700}
.exp-sub{color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.metric small{color:var(--muted)} .metric b{display:block;font-size:21px;margin-top:5px}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding:8px 8px env(safe-area-inset-bottom);background:rgba(255,253,249,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:10;display:flex;justify-content:center}
.nav-inner{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;color:#918a82;font-size:10px;padding:5px 2px}
.nav button span{display:block;font-size:20px;margin-bottom:2px}
.nav button.active{color:var(--accent2);font-weight:700}
.muted{color:var(--muted);font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(min-width:600px){.page{padding-top:32px} .transit{min-width:54%}}
</style>
</head>

function fmtDate(s) {
  const d = new Date(s.replace(' ','T'));

}
function maps(q) {

}
function showTab(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));

  window.scrollTo({top:0,behavior:'smooth'});

}
function firstNext() {
  const items=[];
  TRIP.flights.forEach(x=>items.push({kind:'flight',start:x.datetime_start,end:x.datetime_end,title:x.flight_no,from:x.from,to:x.to}));
  TRIP.trains.forEach(x=>items.push({kind:'train',start:x.datetime_start,end:x.datetime_end,title:'MÁV '+x.train_no,from:{city:x.from.city,code:x.from.station},to:{city:x.to.city,code:x.to.station}}));
  TRIP.ferries.forEach(x=>items.push({kind:'ferry',start:x.datetime_start,end:x.datetime_end,title:'Split ↔ Hvar',from:{city:'Split',code:'SPU'},to:{city:'Hvar',code:'HVR'}}));
  TRIP.car_rentals.forEach(x=>items.push({kind:'car',start:x.datetime_start,end:x.datetime_end,title:'Sixt 租车',from:{city:'Split',code:'Split'},to:{city:'Dubrovnik',code:'Dubrovnik'}}));
  items.sort((a,b)=>new Date(a.start)-new Date(b.start));
  const now=new Date();
  return items.find(x=>new Date(x.end||x.start)>now) || items[items.length-1];
}
function countdownText(target) {
  const diff = new Date(target)-new Date();
  if(diff<=0) return '正在进行 / 即将开始';
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000), m=Math.floor(diff%3600000/60000);
  return `${d}天 ${h}小时 ${m}分`;
}

    <div class="notice">沿克罗地亚 8 号沿海公路（D8）南下，异地还车。还车点为 Rixos Libertas 酒店车库，钥匙按预订说明交酒店前台。</div>
   </div>
   <div class="section-head"><h2>取车检查</h2></div>
   <div class="card check-group">${checks1.map((x,i)=>`<label class="check-row"><input type="checkbox" data-drive="p${i}"><span>${x}</span></label>`).join('')}</div>
   <div class="section-head"><h2>还车检查</h2></div>
   <div class="card check-group">${checks2.map((x,i)=>`<label class="check-row"><input type="checkbox" data-drive="d${i}"><span>${x}</span></label>`).join('')}</div>
   <div class="section-head"><h2>驾驶提醒</h2></div>
   <div class="card check-group">
     <div class="muted" style="line-height:1.8">靠右行驶；页面中的限速/收费信息仅作行程提醒，实际以当地道路标识与官方规则为准。老城区停车与通行限制需现场确认。国际驾照/驾照要求请以租车公司及当地法规为准。</div>
   </div>
   <div class="section-head"><h2>费用明细</h2></div>
   <details class="card collapsible"><summary>展开查看租车费用</summary><div class="costs">
     <div class="cost-row"><span>租车费用</span><b>€${costs.rental_days_eur.toFixed(2)}</b></div>
     <div class="cost-row"><span>异地还车费</span><b>€${costs.one_way_fee_eur.toFixed(2)}</b></div>
     <div class="cost-row"><span>Road tax</span><b>€${costs.road_tax_rfl_eur.toFixed(2)}</b></div>
     <div class="cost-row"><span>全险保障</span><b>€${costs.all_inclusive_protection_eur.toFixed(2)}</b></div>
     <div class="cost-row"><span>当地税</span><b>€${costs.local_tax_eur.toFixed(2)}</b></div>
     <div class="cost-row"><span>预付总额</span><b>€${c.prepaid_amount_eur.toFixed(2)}</b></div>
   </div></details>`;
}
function getChecklist() {
 try { return JSON.parse(localStorage.getItem(STORAGE.checklist)) || [
  {text:'护照',done:false},{text:'充电器',done:false},{text:'转换插头',done:false},
  {text:'银行卡 / 现金',done:false},{text:'常用药品',done:false},{text:'耳机',done:false}
 ]; } catch(e) { return []; }
}
function saveChecklist(x) {localStorage.setItem(STORAGE.checklist,JSON.stringify(x))}
function renderChecklist() {
 const items=getChecklist();
 document.getElementById('checklist').innerHTML=`
  <div class="section-head"><h2>✓ 打包清单</h2><span>仅自己可见</span></div>
  <div class="card form"><div style="display:flex;gap:8px"><input id="newItem" placeholder="+ 添加物品" onkeydown="if(event.key==='Enter')addItem()"><button class="primary" onclick="addItem()">添加</button></div></div>
  <div class="list">${items.map((x,i)=>`<div class="item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleItem(${i})"><span class="grow">${x.text}</span><button class="del" onclick="deleteItem(${i})">×</button></div>`).join('') || '<div class="empty">还没有物品</div>'}</div>
  <div class="notice">本清单使用当前设备的本地持久化存储，不会和同行人的清单混在一起。</div>`;
}
function addItem() {const el=document.getElementById('newItem'); const text=el.value.trim(); if(!text)return; const a=getChecklist();a.push({text,done:false});saveChecklist(a);renderChecklist();setTimeout(()=>document.getElementById('newItem')?.focus(),0)}
function toggleItem(i) {const a=getChecklist();a[i].done=!a[i].done;saveChecklist(a);renderChecklist()}
function deleteItem(i) {const a=getChecklist();a.splice(i,1);saveChecklist(a);renderChecklist()}

function getExpenses() {try{return JSON.parse(localStorage.getItem(STORAGE.expenses))||[]}catch(e){return[]}}
function saveExpenses(x){localStorage.setItem(STORAGE.expenses,JSON.stringify(x))}
let rates={CNY:1,EUR:7.85,HUF:0.021};
let rateAt='示例汇率';
async function refreshRates(){
  try {
    const r=await fetch('https://open.er-api.com/v6/latest/CNY');
    const j=await r.json();
    if(j?.rates){rates={CNY:1,EUR:1/j.rates.CNY* j.rates.EUR,HUF:1/j.rates.CNY*j.rates.HUF};rateAt=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});renderExpenses();}
  } catch(e) {rateAt='获取失败，当前使用兜底汇率';}
}
function renderExpenses(){
 const ex=getExpenses(); const total=ex.reduce((s,x)=>s+(x.amount_cny_snapshot||0),0);
 const balances={'NING LI':0,'LEQI WEI':0};
 ex.forEach(x=>{if(x.split_type==='even_split'){const half=x.amount_cny_snapshot/2;balances[x.payer]+=half;Object.keys(balances).filter(k=>k!==x.payer).forEach(k=>balances[k]-=half)}});
 const settle=balances['NING LI']>0?`NING LI 应收 LEQI WEI ¥${balances['NING LI'].toFixed(0)}`:balances['LEQI WEI']>0?`LEQI WEI 应收 NING LI ¥${balances['LEQI WEI'].toFixed(0)}`:'目前无需结算';
 document.getElementById('expenses').innerHTML=`
  <div class="section-head"><h2>¥ 账本</h2><span>同行人共享</span></div>
  <div class="notice">本页记账内容设计为 shared=true：同行人打开同一个旅行链接时应看到同一份账本。当前这个静态原型先用浏览器本地存储演示；接入后端后即可改成真正跨设备同步。</div>
  <div class="summary-grid" style="margin-top:12px"><div class="metric"><small>旅行总花费（人民币）</small><b>¥${total.toFixed(2)}</b></div><div class="metric"><small>AA 结算</small><b style="font-size:14px">${settle}</b></div></div>
  <div class="section-head"><h2>+ 记一笔</h2><span>记账时保存汇率快照</span></div>
  <div class="card form">
   <div class="row"><input id="eAmount" type="number" step="0.01" placeholder="金额"><select id="eCurrency"><option>EUR</option><option>CNY</option><option>HUF</option></select></div>
   <div class="row" style="margin-top:10px"><select id="eCategory"><option>交通</option><option>住宿</option><option>餐饮</option><option>门票</option><option>购物</option><option>其他</option></select><select id="ePayer"><option>NING LI</option><option>LEQI WEI</option></select></div>
   <div class="row" style="margin-top:10px"><select id="eSplit"><option value="even_split">两人平摊</option><option value="record_only">仅记录不分摊</option></select><input id="eNote" placeholder="备注"></div>
   <button class="primary full" onclick="addExpense()">保存并锁定汇率快照</button>
  </div>
  <div class="section-head"><h2>实时汇率</h2><button class="secondary" onclick="refreshRates()">↻ 刷新</button></div>
  <div class="card form"><div><b>1 EUR ≈ ¥${rates.EUR.toFixed(4)}</b> · 1 HUF ≈ ¥${rates.HUF.toFixed(4)}</div><div class="muted" style="margin-top:5px">更新于 ${rateAt} · 临时换算工具与历史账本快照相互独立</div>
  <div class="row" style="margin-top:10px"><input id="convertAmount" type="number" placeholder="金额" oninput="convertNow()"><select id="convertCurrency" onchange="convertNow()"><option>EUR</option><option>HUF</option><option>CNY</option></select></div><div id="convertOut" style="margin-top:10px;font-weight:700">—</div></div>
  <div class="section-head"><h2>支出记录</h2><span>${ex.length} 笔</span></div>
  <div class="list">${ex.slice().reverse().map((x,i)=>`<div class="card expense"><div class="exp-top"><span>${x.category} · ${x.payer}</span><span>${x.currency} ${x.amount.toFixed(2)}</span></div><div class="exp-sub">¥${x.amount_cny_snapshot.toFixed(2)} · 记账汇率 1 ${x.currency}≈¥${x.exchange_rate_snapshot.toFixed(4)}<br>${x.split_type==='even_split'?'两人平摊':'仅记录'} · ${x.note||'无备注'}</div></div>`).join('') || '<div class="empty">暂无支出，先记第一笔吧</div>'}</div>`;
}
function addExpense(){
 const amount=Number(document.getElementById('eAmount').value),currency=document.getElementById('eCurrency').value;
 if(!amount||amount<=0)return;
 const ex=getExpenses(), rate=rates[currency]||1;
 ex.push({id:'expense-'+Date.now(),amount,currency,exchange_rate_snapshot:rate,amount_cny_snapshot:amount*rate,rate_fetched_at:new Date().toISOString(),category:document.getElementById('eCategory').value,payer:document.getElementById('ePayer').value,split_type:document.getElementById('eSplit').value,split_between:['NING LI','LEQI WEI'],note:document.getElementById('eNote').value,date:new Date().toISOString().slice(0,10)});
 saveExpenses(ex);renderExpenses();
}
function convertNow(){
 const amount=Number(document.getElementById('convertAmount')?.value||0), c=document.getElementById('convertCurrency')?.value||'EUR';
 const cny=amount*(rates[c]||1); const out=document.getElementById('convertOut'); if(out)out.textContent=amount?`≈ ¥${cny.toFixed(2)} CNY（当前实时汇率）`:'—';
}

renderHome(); renderItinerary(); renderDriving(); renderChecklist(); renderExpenses();
document.querySelector('.nav button[data-tab="home"]').classList.add('active');
</script>
</body>
